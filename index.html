<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Testy – nauka</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1f2430; --muted: #6b7280; --line: #e2e6ec;
    --accent: #3b5bdb; --accent-bg: #e8edff;
    --ok: #2b8a57; --ok-bg: #e7f5ee; --bad: #c92a2a; --bad-bg: #fdeceb;
    --warn: #9a6200; --warn-bg: #fff4dc; --pres: #7048e8; --pres-bg: #f0ebff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --card: #1b1e26; --ink: #e6e8ee; --muted: #9aa0ab; --line: #2b303b;
      --accent: #8ea6ff; --accent-bg: #222b4a;
      --ok: #6fcf97; --ok-bg: #16301f; --bad: #ff8f8f; --bad-bg: #3a1d1f;
      --warn: #f5c56b; --warn-bg: #362c15; --pres: #b9a3ff; --pres-bg: #2c2448;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  h1 small { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink);
         padding: 8px 14px; border-radius: 8px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .btn.danger:hover { border-color: var(--bad); color: var(--bad); }

  .tabs { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tab { border: 1px solid transparent; border-bottom: none; background: none; color: var(--muted);
         padding: 8px 14px; border-radius: 8px 8px 0 0; white-space: nowrap; margin-bottom: -1px; }
  .tab b { font-weight: 700; }
  .tab.on { background: var(--card); border-color: var(--line); color: var(--ink); }

  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.ok b { color: var(--ok); } .stat.warn b { color: var(--warn); }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }

  details.topics { margin-bottom: 14px; }
  details.topics summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--muted);
          padding: 4px 10px; border-radius: 99px; font-size: 13px; }
  .chip.on { border-color: var(--accent); color: var(--ink); background: var(--accent-bg); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .meta > span { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tag { padding: 2px 8px; border-radius: 99px; background: var(--bg); }
  .tag.retry { background: var(--warn-bg); color: var(--warn); }
  .tag.test { background: var(--accent-bg); color: var(--accent); }
  .tag.pres { background: var(--pres-bg); color: var(--pres); }
  .licznik { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center;
             border: 1.5px solid var(--muted); color: var(--ink); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
  .q { font-size: 19px; font-weight: 600; margin: 4px 0 16px; }
  .opts { display: grid; gap: 8px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
         border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
         padding: 12px 14px; border-radius: 10px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt .l { flex: none; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center;
            background: var(--bg); font-weight: 700; font-size: 14px; }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.correct .l { background: var(--ok); color: var(--card); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .l { background: var(--bad); color: var(--card); }
  .opt.dim { opacity: .55; }

  .feedback { margin-top: 16px; border-radius: 10px; padding: 14px 16px; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--ok-bg); }
  .feedback.bad { background: var(--bad-bg); }
  .feedback h3 { margin: 0 0 6px; font-size: 16px; }
  .feedback.ok h3 { color: var(--ok); } .feedback.bad h3 { color: var(--bad); }
  .feedback p { margin: 0; }
  .next { margin-top: 14px; display: none; justify-content: flex-end; }
  .next.show { display: flex; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }
  .done { text-align: center; padding: 30px 10px; }
  .done h2 { margin-top: 0; }
  @media (max-width: 620px) { .stats { grid-template-columns: repeat(3, 1fr); } .q { font-size: 17px; } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs"></nav>
  <header>
    <h1 id="tytul">Testy</h1>
    <button class="btn danger" id="reset">Zresetuj test</button>
  </header>

  <div class="stats">
    <div class="stat ok"><b id="sDone">0</b><span>opanowane</span></div>
    <div class="stat warn"><b id="sRetry">0</b><span>do powtórki</span></div>
    <div class="stat"><b id="sNew">0</b><span>jeszcze nie było</span></div>
    <div class="stat"><b id="sAcc">–</b><span>skuteczność</span></div>
    <div class="stat"><b id="sCzas">0:00</b><span>czas</span></div>
  </div>
  <div class="bar"><div id="bar"></div></div>

  <details class="topics">
    <summary>Zakres tematów (kliknij, żeby wybrać)</summary>
    <div class="chips" id="chips"></div>
  </details>

  <div class="card" id="card">Ładowanie pytań…</div>
  <div class="hint">Skróty: 1–4 lub A–D – odpowiedź, Enter – następne pytanie</div>
</div>

<script src="app.js"></script>
</body>
</html>
